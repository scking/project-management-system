name: project-management-system

services:
  backend:
    build:
      context: ./backend
    container_name: project-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3307
      DB_NAME: project_mgmt
      DB_USER: root
      DB_PASS: root
      PORTAL_SSO_BASE_URL: http://host.docker.internal:3000/api
    ports:
      - "9280:9280"

  frontend:
    build:
      context: ./frontend
    container_name: project-frontend
    depends_on:
      - backend
    ports:
      - "3280:80"
