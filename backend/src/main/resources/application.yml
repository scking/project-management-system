server:
  port: 9280
  servlet:
    context-path: /api

spring:
  application:
    name: project-management-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/project_mgmt;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

portal:
  sso-base-url: ${PORTAL_SSO_BASE_URL:http://127.0.0.1:3000/api}
  app-code: project

app:
  jwt-secret: project-system-dev-secret
  token-expire-seconds: 28800
